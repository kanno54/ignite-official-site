name: IGNITE Official Site — Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Content Data
        run: npm run validate:data

      - name: Validate Asset Manifest
        run: npm run validate:assets

      - name: Production Build & Prerender
        run: npm run build

      - name: Verify Static Output Routes
        run: npm run test:static

      - name: Assert Public Cutoff Safety
        run: npm run assert-public-cutoff

      - name: Deploy to Onamae Server via lftp
        if: github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.SFTP_HOST }}
          FTP_USER: ${{ secrets.SFTP_USERNAME }}
          FTP_PASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          cd ./dist
          cat <<EOF > deploy.lftp
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set net:timeout 15
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          mirror -R --verbose --no-perms --no-symlinks --ignore-time --parallel=2 . .
          quit
          EOF
          lftp -f deploy.lftp
