name: IGNITE production — Build & Deploy
# SITE_OPS_MANUAL_PRODUCTION_V1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter PRODUCTION: followed by the full current main commit SHA'
        required: true
        type: string

concurrency:
  group: ignite-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == format('PRODUCTION:{0}', github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_STAGING: 'false'
      VITE_SITE_URL: 'https://ignite-official.site'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Routine content and route checks
        run: npm run site -- check production
      - name: Operations safety tests
        run: npm run test:site-ops
      - name: Build (includes TypeScript check)
        run: npm run build
      - run: npm run test:static
      - run: npm run assert-public-cutoff
      - name: Record revision and entry asset hashes
        run: npm run site -- manifest production
      - name: Deploy using existing lftp transport
        env:
          SITE_ENV: production
          FTP_HOST: ${{ secrets.SFTP_HOST }}
          FTP_USER: ${{ secrets.SFTP_USERNAME }}
          FTP_PASS: ${{ secrets.SFTP_PASSWORD }}
          # Reuse the legacy production-path secret when the dedicated name has
          # not been migrated yet. deploy-site.sh still rejects broad paths.
          FTP_PATH: ${{ secrets.SFTP_PROD_PATH || secrets.SFTP_REMOTE_PATH }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          bash scripts/deploy-site.sh
      - name: Verify deployed revision, HTML, assets and audio
        run: npm run site -- verify production --sha "$GITHUB_SHA"
