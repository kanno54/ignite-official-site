name: IGNITE Staging Environment — Build & Deploy

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

jobs:
  build-and-deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Content Data
        run: npm run validate:data

      - name: Validate Asset Manifest
        run: npm run validate:assets

      - name: Build Staging Static Output
        env:
          VITE_STAGING: 'true'
          VITE_SITE_URL: 'https://staging.ignite-official.site'
        run: npm run build

      - name: Prepare Staging Protection & Noindex
        run: node scripts/prepare-staging-dist.mjs

      - name: Deploy to Staging Server via lftp
        if: github.ref == 'refs/heads/staging'
        env:
          FTP_HOST: ${{ secrets.SFTP_HOST }}
          FTP_USER: ${{ secrets.SFTP_USERNAME }}
          FTP_PASS: ${{ secrets.SFTP_PASSWORD }}
          FTP_PATH: ${{ secrets.SFTP_STAGING_PATH || secrets.SFTP_REMOTE_PATH }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          cd ./dist

          LISTING=$(lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode on;
            set net:timeout 10;
            set net:max-retries 1;
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            cls -1;
            quit;
          " 2>/dev/null || echo "")

          echo "--- FTP ROOT DIRECTORY LISTING ---"
          echo "$LISTING"
          echo "-----------------------------------"

          TARGET_DIR=""
          if [ -n "$FTP_PATH" ]; then
            TARGET_DIR="$FTP_PATH"
          elif echo "$LISTING" | grep -q "public_html"; then
            TARGET_DIR="public_html/staging.ignite-official.site"
          elif echo "$LISTING" | grep -q "staging.ignite-official.site"; then
            TARGET_DIR="staging.ignite-official.site"
          else
            TARGET_DIR="public_html/staging.ignite-official.site"
          fi

          echo "Selected Target Directory: $TARGET_DIR"

          cat <<EOF > deploy.lftp
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set net:timeout 15
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          mkdir -p "$TARGET_DIR"
          cd "$TARGET_DIR"
          mirror -R --verbose --no-perms --no-symlinks --ignore-time --parallel=2 . .
          quit
          EOF

          lftp -f deploy.lftp

